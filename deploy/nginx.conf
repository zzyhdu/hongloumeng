server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types
    application/javascript
    application/json
    application/pdf
    image/svg+xml
    text/css
    text/plain;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /resource/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /full_graph.json {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
